name: Deploy

# main에 머지되면 자동 배포한다. 문제가 생기면 Actions 탭에서 workflow_dispatch로
# 이전 커밋을 골라 다시 배포할 수 있다.
# 매일 03:00 KST(UTC 18:00)에도 같은 빌드를 다시 돌려 홈의 인기글(최근 30일 조회수 상위 5편)을 갱신한다(PRD-004 5.5).
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Package Install
        run: yarn install

      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}

      # 인기글: 직전 결과를 복원해 두면 통계 API가 실패해도 그 값을 쓴다(실행 끝에 이번 결과가 새 키로 저장된다)
      - name: Restore popular posts cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: popular-${{ github.run_id }}
          restore-keys: popular-

      # GoatCounter 통계 API → .cache/popular.json. 토큰은 이 단계에서만 쓰고, 실패해도 빌드는 계속된다(scripts/fetch-popular.mjs)
      - name: Fetch popular posts
        run: node scripts/fetch-popular.mjs
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Build
        run: yarn build

      # About을 인쇄해 out/resume.pdf를 만든다. 실패하면 배포하지 않는다(About과 PDF가 어긋나지 않게)
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Build resume.pdf
        run: yarn build:resume

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
