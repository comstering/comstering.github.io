name: CI

on:
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # Lighthouse 요약 댓글

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 관측 Lighthouse(약 4분)와 Playwright 의존성 설치(최대 4분)가 겹치면 10분에 근접한다

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install
        run: yarn install --frozen-lockfile

      # 변환한 이미지(public/_img)는 원본이 같으면 그대로 쓴다 (scripts/optimize-images.mjs가 해시로 판단)
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/images/**', 'scripts/optimize-images.mjs') }}

      - name: Lint
        run: yarn lint

      - name: Check design tokens
        run: yarn check:tokens

      # frontmatter 검증(content/*.yaml, posts/*.md)도 이 단계에서 수행된다.
      - name: Build
        run: yarn build

      - name: Check build output
        run: yarn check:output

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: E2E
        run: yarn test:e2e

      # PRD-003 "성능 측정 기준"(Q12, 2026-10-30): 실제 Chrome 관측(devtools throttling), 3회 중앙값. 접근성·SEO는 error, 성능·LCP·CLS·TBT 차단선은 PR-17부터 error(지금은 warn). lighthouserc.json의 assertMatrix 참고
      - name: Lighthouse CI
        run: yarn lhci

      # 점수 요약을 Actions 요약 화면과 PR 댓글(1개를 계속 갱신)에 남긴다.
      - name: Summarize Lighthouse
        if: always()
        run: |
          node scripts/lighthouse-summary.mjs lighthouse-summary.md
          cat lighthouse-summary.md >> "$GITHUB_STEP_SUMMARY"

      # 포크 PR은 토큰이 읽기 전용이라 댓글을 못 단다. 실패해도 CI를 깨뜨리지 않는다.
      - name: Comment Lighthouse summary
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- lighthouse-ci-summary -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\"))][0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@lighthouse-summary.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@lighthouse-summary.md
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lighthouse-reports
          include-hidden-files: true # .lighthouseci는 점으로 시작해서 기본으로는 올라가지 않는다
          path: |
            playwright-report
            .lighthouseci
            lighthouse-summary.md
          retention-days: 7
