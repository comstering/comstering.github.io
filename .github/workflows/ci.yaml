name: CI

on:
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "yarn"

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Check design tokens
        run: yarn check:tokens

      # frontmatter 검증(content/*.yaml, posts/*.md)도 이 단계에서 수행된다.
      - name: Build
        run: yarn build

      - name: Check build output
        run: yarn check:output

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: E2E
        run: yarn test:e2e

      # PRD-003 PR-10: 처음에는 경고(warn)만. PR-14 이미지 작업 후 error로 올린다.
      - name: Lighthouse CI
        run: yarn lhci

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-lighthouse-reports
          path: |
            playwright-report
            .lighthouseci
          retention-days: 7
