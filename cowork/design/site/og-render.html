<!doctype html>
<html lang="ko" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>OG render</title>
<meta name="description" content="OG 이미지 렌더용 단독 페이지. ?t=제목&c=infra,oss&d=2025-08-13&s=series eks 3/5">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../system/tokens.css">
<link rel="stylesheet" href="../system/base.css">
<link rel="stylesheet" href="../system/components.css">
<style>html,body{margin:0;background:#0c0f0e;width:1200px;height:630px;overflow:hidden}.og{border:0}</style>
</head>
<body>
<!-- 시안용 렌더 페이지. 구현은 PR-15(satori 또는 opengraph-image.tsx)에서 같은 구성으로 만든다 -->
<div class="og"><div class="og__top"><span><b>~/</b>comstering<i>_</i></span><span>comstering.github.io</span></div><div class="og__title" id="t"></div><div class="og__meta" id="m"></div></div>
<script>
var p = new URLSearchParams(location.search);
document.getElementById("t").textContent = p.get("t") || "제목";
var m = document.getElementById("m");
var order = ["infra", "backend", "frontend", "oss", "note"];
(p.get("c") || "infra").split(",").sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); })
  .reduce(function (s, c, i) { s.textContent += (i ? ", " : "") + c; return s; }, Object.assign(m.appendChild(document.createElement("span")), { className: "cat" }));
[p.get("d"), p.get("s")].forEach(function (v) { if (v) { var s = document.createElement("span"); s.textContent = v; m.appendChild(s); } });
</script>
</body>
</html>
